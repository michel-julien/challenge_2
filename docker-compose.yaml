services:
  secure:
    build:
      context: ./secure
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: development
      CI: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: "5001"
      PORT: "5001"
      JWT_SECRET: "${SECURE_JWT_SECRET:-local-development-secret-change-me-please-32}"
      JWT_EXPIRES_IN: "${SECURE_JWT_EXPIRES_IN:-1h}"
      CORS_ORIGIN: "${SECURE_CORS_ORIGIN:-http://localhost:5000}"
    ports:
      - "${SECURE_PORT:-5001}:5001"
    volumes:
      - ./secure:/app
      - secure_node_modules:/app/node_modules
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm dev"]
    healthcheck:
      test: >-
        node -e "fetch('http://127.0.0.1:5001/health').then((response) =>
        process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  unsecure:
    build:
      context: ./unsecure
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: development
      CI: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: "5002"
      PORT: "5002"
    ports:
      - "${UNSECURE_PORT:-5002}:5002"
    volumes:
      - ./unsecure:/app
      - unsecure_node_modules:/app/node_modules
    command: ["sh", "-c", "pnpm install --frozen-lockfile && pnpm dev"]
    healthcheck:
      test: >-
        node -e "fetch('http://127.0.0.1:5002/health').then((response) =>
        process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: development
      CI: "true"
      APP_HOST: 0.0.0.0
      APP_PORT: "5000"
      HOSTNAME: 0.0.0.0
      PORT: "5000"
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      secure:
        condition: service_healthy
      unsecure:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command:
      - sh
      - -c
      - pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0 --port 5000

volumes:
  secure_node_modules:
  unsecure_node_modules:
  frontend_node_modules:
  frontend_next:
